name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing:
# add this repository as a trusted publisher for the `cldf-mcp` project on pypi.org first
# (Publishing > Add a new pending publisher: workflow `publish.yml`, environment `pypi`).

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" build
      - run: pytest -q
      - name: Check the release tag matches the package version
        run: |
          version=$(python -c "import cldf_mcp; print(cldf_mcp.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
