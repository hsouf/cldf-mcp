# Pinned dataset releases. Files are fetched from the tagged release and verified
# against these SHA-256 checksums before anything is loaded.
#
# role = "features"  a CLDF StructureDataset whose values become queryable features
# role = "catalog"   Glottolog: the language catalog and classification every other
#                    dataset is joined through (by Glottocode). Selected parameters can
#                    also be exposed as features via `feature_parameters`.

[datasets.wals]
title = "The World Atlas of Language Structures Online"
short_title = "WALS"
role = "features"
version = "v2020.6"
edition_note = "Data of the 2013 WALS Online edition, CLDF release v2020.6"
base_url = "https://raw.githubusercontent.com/cldf-datasets/wals/v2020.6/cldf/"
repository = "https://github.com/cldf-datasets/wals"
homepage = "https://wals.info"
license = "CC-BY-4.0"
citation = "Dryer, Matthew S. & Haspelmath, Martin (eds.) 2013. The World Atlas of Language Structures Online. Leipzig: Max Planck Institute for Evolutionary Anthropology. (Available online at https://wals.info)"
metadata = "StructureDataset-metadata.json"
names_table = "language_names.csv"
bibliography = "sources.bib"
language_url = "https://wals.info/languoid/lect/wals_code_{id}"
feature_url = "https://wals.info/feature/{id}"
contribution_url = "https://wals.info/chapter/{id}"

